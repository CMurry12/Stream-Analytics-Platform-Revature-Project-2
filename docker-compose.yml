# StreamFlow Analytics Platform - Docker Compose Stack
# All components run in Docker containers

services:
  # =============================================================================
  # ZOOKEEPER (Required for Confluent Kafka)
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: streamflow-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
        disable: true
    networks:
      - streamflow-network

  # =============================================================================
  # KAFKA (Confluent Platform)
  # =============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamflow-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      zookeeper:
        condition: service_started
    networks:
      - streamflow-network

  # =============================================================================
  # KAFKA UI (For Debugging/Monitoring)
  # =============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streamflow-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=streamflow
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - streamflow-network

  # =============================================================================
  # POSTGRES (Airflow Metadata Database)
  # =============================================================================
  postgres:
    image: postgres:16
    container_name: streamflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamflow-network

  # =============================================================================
  # MINIO (S3-Compatible Object Storage)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: streamflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - streamflow-network

  minio-init:
    image: minio/mc:latest
    container_name: streamflow-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/datalake || true
      "
    networks:
      - streamflow-network

  # =============================================================================
  # SPARK (Master + Worker) - Using official Apache Spark image
  # =============================================================================
  # Init container to set up volume permissions
  spark-init:
    image: busybox
    container_name: streamflow-spark-init
    command: [ "sh", "-c", "mkdir -p /opt/spark-data/landing /opt/spark-data/gold && chmod -R 777 /opt/spark-data" ]
    volumes:
      - spark_data:/opt/spark-data
    networks:
      - streamflow-network

  spark-master:
    image: apache/spark:3.5.0
    container_name: streamflow-spark-master
    user: root
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_NO_DAEMONIZE=true
    command: [ "/opt/spark/sbin/start-master.sh" ]
    volumes:
      - ./jobs:/opt/spark-jobs
      - spark_data:/opt/spark-data
    depends_on:
      spark-init:
        condition: service_completed_successfully
    networks:
      - streamflow-network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: streamflow-spark-worker
    user: root
    depends_on:
      spark-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    command: [ "/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077" ]
    volumes:
      - ./jobs:/opt/spark-jobs
      - spark_data:/opt/spark-data
    networks:
      - streamflow-network

  # =============================================================================
  # AIRFLOW (Custom Image with Spark Client)
  # =============================================================================
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: streamflow-airflow
    # Run as root to match Spark container permissions for shared volume access
    user: root
    ports:
      - "8082:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__PARALLELISM=4
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=4
      - AIRFLOW__SCHEDULER__PARSING_PROCESSES=2
      - AIRFLOW__WEBSERVER__WORKERS=2
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=2VGiNvoB0qhlxDMs1EbozR5sVSIJc68BgUlnFLuz_zI=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=streamflow-secret-key
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./jobs:/opt/spark-jobs
      - spark_data:/opt/spark-data
      - airflow_logs:/opt/airflow/logs
      - airflow_data:/opt/airflow
    command: [ "bash", "-c", "airflow triggerer & airflow scheduler & exec airflow webserver" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    networks:
      - streamflow-network

  # =============================================================================
  # STREAMLIT (Frontend for Data Exploration)
  # =============================================================================
  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: streamflow-streamlit
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - DATA_ROOT=/opt/spark-data
    volumes:
      - spark_data:/opt/spark-data:ro
      - ./streamlit:/app
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - streamflow-network

# =============================================================================
# NETWORKS & VOLUMES
# =============================================================================
networks:
  streamflow-network:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  postgres_data:
  minio_data:
  airflow_data:
  airflow_logs:
  spark_data:
